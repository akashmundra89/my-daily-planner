<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Daily Planner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-tertiary: #eeede9;
      --bg-info: #e6f1fb;
      --bg-success: #e1f5ee;
      --bg-warning: #faeeda;
      --bg-danger: #fcebeb;
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-tertiary: #888780;
      --text-info: #0c447c;
      --text-success: #085041;
      --text-warning: #633806;
      --text-danger: #791f1f;
      --border: rgba(0,0,0,0.12);
      --border-md: rgba(0,0,0,0.22);
      --border-strong: rgba(0,0,0,0.35);
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --purple: #534AB7;
      --purple-light: #EEEDFE;
      --purple-dark: #3C3489;
    }
    body { font-family: var(--font); background: var(--bg-tertiary); min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
    .app-wrap { width: 100%; max-width: 680px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .header-title { font-size: 18px; font-weight: 500; color: var(--text-primary); }
    .header-date { font-size: 13px; color: var(--text-tertiary); margin-top: 2px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--purple-light); display: flex; align-items: center; justify-content: center; }
    .tabs { display: flex; margin-bottom: 1.5rem; border: 0.5px solid var(--border-md); border-radius: var(--radius-lg); padding: 4px; background: var(--bg-secondary); gap: 0; }
    .tab { flex: 1; padding: 7px 0; border: none; border-radius: var(--radius-md); background: transparent; font-size: 13px; cursor: pointer; color: var(--text-secondary); font-weight: 400; display: flex; align-items: center; justify-content: center; gap: 5px; transition: all 0.15s; font-family: var(--font); }
    .tab.active { background: var(--bg-primary); color: var(--text-primary); font-weight: 500; border: 0.5px solid var(--border); }
    .section { display: none; }
    .section.active { display: block; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
    .stat { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 12px 14px; }
    .stat-num { font-size: 22px; font-weight: 500; color: var(--text-primary); }
    .stat-lbl { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
    .progress-bar { height: 4px; background: var(--bg-secondary); border-radius: 2px; margin-bottom: 1.25rem; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--purple); border-radius: 2px; transition: width 0.3s; }
    .panel { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    .panel-label { font-size: 11px; font-weight: 500; color: var(--text-tertiary); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 10px; }
    .row { display: flex; gap: 7px; align-items: center; margin-bottom: 7px; }
    .row:last-child { margin-bottom: 0; }
    input, select, textarea { font-size: 13px; padding: 7px 9px; border: 0.5px solid var(--border-md); border-radius: var(--radius-md); background: var(--bg-primary); color: var(--text-primary); outline: none; font-family: var(--font); }
    input[type="text"] { flex: 1; }
    input[type="time"], input[type="date"] { width: 118px; }
    select { width: 118px; }
    textarea { flex: 1; resize: vertical; min-height: 60px; line-height: 1.5; }
    input:focus, select:focus, textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(83,74,183,0.1); }
    .add-btn { padding: 7px 14px; background: var(--purple); color: var(--purple-light); border: none; border-radius: var(--radius-md); font-size: 13px; cursor: pointer; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 4px; flex-shrink: 0; font-family: var(--font); }
    .add-btn:hover { background: var(--purple-dark); }
    .search-wrap { position: relative; margin-bottom: 1rem; }
    .search-wrap .si { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 16px; pointer-events: none; }
    .search-input { width: 100%; padding: 8px 36px 8px 34px; font-size: 13px; border: 0.5px solid var(--border-md); border-radius: var(--radius-lg); background: var(--bg-primary); color: var(--text-primary); outline: none; font-family: var(--font); }
    .search-input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(83,74,183,0.1); }
    .clear-search { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-tertiary); font-size: 16px; padding: 2px; display: none; }
    .clear-search.show { display: block; }
    .filter-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
    .chip { padding: 4px 11px; border: 0.5px solid var(--border-md); border-radius: 20px; font-size: 12px; cursor: pointer; background: transparent; color: var(--text-secondary); transition: all 0.12s; font-family: var(--font); }
    .chip.active { background: var(--purple-light); color: var(--purple-dark); border-color: transparent; font-weight: 500; }
    .search-count { font-size: 12px; color: var(--text-tertiary); margin-left: auto; }
    .task-card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: 0 var(--radius-lg) var(--radius-lg) 0; padding: 10px 12px; margin-bottom: 7px; display: flex; align-items: flex-start; gap: 10px; border-left: 3px solid transparent; transition: border-color 0.15s; }
    .task-card:hover { border-color: var(--border-md); }
    .task-card.done { opacity: 0.5; }
    .task-card.p-high { border-left-color: #E24B4A; }
    .task-card.p-medium { border-left-color: #EF9F27; }
    .task-card.p-low { border-left-color: #1D9E75; }
    .check-btn { width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid var(--border-md); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; transition: all 0.15s; }
    .check-btn.done { background: var(--purple); border-color: var(--purple); }
    .task-body { flex: 1; min-width: 0; }
    .task-text { font-size: 13px; color: var(--text-primary); line-height: 1.4; }
    .task-text mark { background: #FAC775; color: #412402; border-radius: 2px; padding: 0 2px; }
    .task-card.done .task-text { text-decoration: line-through; color: var(--text-tertiary); }
    .task-note { font-size: 12px; color: var(--text-secondary); margin-top: 5px; line-height: 1.5; padding: 6px 9px; background: var(--bg-secondary); border-radius: var(--radius-md); border-left: 2px solid var(--border-md); }
    .task-note mark { background: #FAC775; color: #412402; border-radius: 2px; padding: 0 2px; }
    .task-note-toggle { font-size: 11px; color: var(--text-tertiary); cursor: pointer; background: none; border: none; padding: 3px 0; display: flex; align-items: center; gap: 3px; margin-top: 4px; font-family: var(--font); }
    .task-note-toggle:hover { color: var(--text-secondary); }
    .task-meta { display: flex; align-items: center; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
    .pill { font-size: 11px; padding: 2px 7px; border-radius: 20px; white-space: nowrap; font-weight: 500; }
    .pill.time { background: var(--bg-secondary); color: var(--text-secondary); border: 0.5px solid var(--border); }
    .pill.cat-work { background: #E6F1FB; color: #0C447C; }
    .pill.cat-personal { background: #EEEDFE; color: #3C3489; }
    .pill.cat-health { background: #E1F5EE; color: #085041; }
    .pill.cat-finance { background: #EAF3DE; color: #27500A; }
    .pill.cat-other { background: var(--bg-secondary); color: var(--text-secondary); }
    .pill.p-high { background: #FCEBEB; color: #791F1F; }
    .pill.p-medium { background: #FAEEDA; color: #633806; }
    .pill.p-low { background: #E1F5EE; color: #085041; }
    .pill.recur { background: #EEEDFE; color: #3C3489; }
    .card-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .del-btn { background: none; border: none; cursor: pointer; color: var(--text-tertiary); padding: 2px; border-radius: 4px; }
    .del-btn:hover { color: #E24B4A; }
    .edit-note-btn { background: none; border: none; cursor: pointer; color: var(--text-tertiary); padding: 2px; border-radius: 4px; }
    .edit-note-btn:hover { color: var(--purple); }
    .note-editor { margin-top: 8px; display: none; }
    .note-editor.open { display: block; }
    .note-editor textarea { width: 100%; min-height: 56px; }
    .note-save-btn { margin-top: 5px; padding: 5px 12px; background: var(--purple); color: var(--purple-light); border: none; border-radius: var(--radius-md); font-size: 12px; cursor: pointer; font-weight: 500; font-family: var(--font); }
    .note-save-btn:hover { background: var(--purple-dark); }
    .notif { background: var(--bg-warning); border: 0.5px solid #FAC775; color: var(--text-warning); border-radius: var(--radius-md); padding: 9px 13px; font-size: 13px; margin-bottom: 1rem; display: none; align-items: center; gap: 8px; }
    .notif.show { display: flex; }
    .empty { text-align: center; padding: 2rem 1rem; color: var(--text-tertiary); font-size: 13px; }
    .empty i { font-size: 28px; display: block; margin: 0 auto 8px; opacity: 0.35; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .cal-nav { background: none; border: 0.5px solid var(--border-md); border-radius: var(--radius-md); padding: 5px 10px; cursor: pointer; color: var(--text-primary); font-size: 13px; font-family: var(--font); }
    .cal-nav:hover { background: var(--bg-secondary); }
    .cal-title { font-size: 15px; font-weight: 500; color: var(--text-primary); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 1.25rem; }
    .cal-dow { text-align: center; font-size: 11px; color: var(--text-tertiary); padding: 4px 0; font-weight: 500; }
    .cal-day { border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 5px; min-height: 52px; cursor: pointer; transition: border-color 0.12s; background: var(--bg-primary); }
    .cal-day:hover { border-color: var(--border-md); }
    .cal-day.other-month { opacity: 0.3; }
    .cal-day.today { border-color: var(--purple); background: var(--purple-light); }
    .cal-day.selected { border-color: var(--purple); border-width: 1.5px; }
    .cal-day-num { font-size: 12px; font-weight: 500; color: var(--text-primary); margin-bottom: 3px; }
    .cal-day.today .cal-day-num { color: var(--purple-dark); }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; margin: 1px; }
    .cal-tasks-title { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 10px; }
    .cred-card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 11px 13px; margin-bottom: 7px; display: flex; align-items: center; gap: 11px; }
    .cred-icon { width: 34px; height: 34px; border-radius: var(--radius-md); background: var(--purple-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cred-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .cred-meta { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
    .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
    .badge.ok { background: #E1F5EE; color: #085041; }
    .badge.warn { background: #FAEEDA; color: #633806; }
    .badge.exp { background: #FCEBEB; color: #791F1F; }
    .export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .export-btn { padding: 12px 14px; border: 0.5px solid var(--border-md); border-radius: var(--radius-lg); background: var(--bg-primary); cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; transition: border-color 0.15s; font-family: var(--font); }
    .export-btn:hover { border-color: var(--purple); }
    .export-btn-label { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .export-btn-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
    .export-icon { width: 34px; height: 34px; border-radius: var(--radius-md); background: var(--purple-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .divider { height: 0.5px; background: var(--border); margin: 1.25rem 0; }
    .upload-label { display: flex; flex-direction: column; align-items: center; border: 0.5px dashed var(--border-md); border-radius: var(--radius-lg); padding: 18px; text-align: center; cursor: pointer; color: var(--text-secondary); font-size: 13px; gap: 6px; }
  </style>
</head>
<body>
<div class="app-wrap">
  <div class="header">
    <div>
      <div class="header-title"><i class="ti ti-layout-dashboard" style="font-size:16px;vertical-align:-2px;margin-right:6px;"></i>My planner</div>
      <div class="header-date" id="today-date"></div>
    </div>
    <div class="avatar"><i class="ti ti-user" style="font-size:17px;color:#534AB7;"></i></div>
  </div>

  <div id="notif" class="notif">
    <i class="ti ti-bell" style="font-size:15px;"></i>
    <span id="notif-text"></span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('tasks')"><i class="ti ti-checkbox" style="font-size:14px;"></i>Tasks</button>
    <button class="tab" onclick="switchTab('calendar')"><i class="ti ti-calendar" style="font-size:14px;"></i>Calendar</button>
    <button class="tab" onclick="switchTab('creds')"><i class="ti ti-id-badge" style="font-size:14px;"></i>Credentials</button>
    <button class="tab" onclick="switchTab('export')"><i class="ti ti-database-export" style="font-size:14px;"></i>Backup</button>
  </div>

  <!-- TASKS -->
  <div id="tasks" class="section active">
    <div class="stats">
      <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">Total tasks</div></div>
      <div class="stat"><div class="stat-num" id="s-done">0</div><div class="stat-lbl">Completed</div></div>
      <div class="stat"><div class="stat-num" id="s-left">0</div><div class="stat-lbl">Remaining</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="panel">
      <div class="panel-label">Add task</div>
      <div class="row">
        <input type="text" id="task-input" placeholder="What needs to be done?" />
        <input type="time" id="task-time" />
      </div>
      <div class="row">
        <select id="task-priority"><option value="medium">Medium priority</option><option value="high">High priority</option><option value="low">Low priority</option></select>
        <select id="task-category"><option value="work">Work</option><option value="personal">Personal</option><option value="health">Health</option><option value="finance">Finance</option><option value="other">Other</option></select>
        <select id="task-recur"><option value="none">No repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="weekdays">Weekdays</option><option value="weekend">Weekends</option></select>
      </div>
      <div class="row">
        <textarea id="task-note" placeholder="Add a note (optional)..." style="min-height:50px;"></textarea>
        <button class="add-btn" onclick="addTask()" style="align-self:flex-end;"><i class="ti ti-plus" style="font-size:14px;"></i>Add</button>
      </div>
    </div>
    <div class="search-wrap">
      <i class="ti ti-search si"></i>
      <input class="search-input" id="search-input" placeholder="Search tasks by title or note..." oninput="onSearch()" />
      <button class="clear-search" id="clear-search" onclick="clearSearch()"><i class="ti ti-x" style="font-size:13px;"></i></button>
    </div>
    <div class="filter-row" id="filter-row"></div>
    <div id="task-list"></div>
  </div>

  <!-- CALENDAR -->
  <div id="calendar" class="section">
    <div class="cal-header">
      <button class="cal-nav" onclick="calNav(-1)"><i class="ti ti-chevron-left" style="font-size:13px;"></i></button>
      <span class="cal-title" id="cal-title"></span>
      <button class="cal-nav" onclick="calNav(1)"><i class="ti ti-chevron-right" style="font-size:13px;"></i></button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div id="cal-tasks"></div>
  </div>

  <!-- CREDENTIALS -->
  <div id="creds" class="section">
    <div class="panel">
      <div class="panel-label">Add credential</div>
      <div class="row">
        <input type="text" id="cred-name" placeholder="Certification or license name..." />
        <input type="text" id="cred-org" placeholder="Issuing org" style="width:120px;flex:0 0 120px;" />
      </div>
      <div class="row">
        <input type="date" id="cred-expiry" />
        <select id="cred-type"><option value="Certification">Certification</option><option value="License">License</option><option value="Training">Training</option><option value="Other">Other</option></select>
        <button class="add-btn" onclick="addCred()"><i class="ti ti-plus" style="font-size:14px;"></i>Add</button>
      </div>
    </div>
    <div id="cred-list"></div>
  </div>

  <!-- BACKUP -->
  <div id="export" class="section">
    <div class="panel">
      <div class="panel-label">Export data</div>
      <div class="export-grid">
        <button class="export-btn" onclick="exportJSON()">
          <div class="export-icon"><i class="ti ti-file-code" style="font-size:17px;color:#534AB7;"></i></div>
          <div><div class="export-btn-label">Export JSON</div><div class="export-btn-sub">Full backup, all data</div></div>
        </button>
        <button class="export-btn" onclick="exportCSV()">
          <div class="export-icon" style="background:#E1F5EE;"><i class="ti ti-file-spreadsheet" style="font-size:17px;color:#085041;"></i></div>
          <div><div class="export-btn-label">Export CSV</div><div class="export-btn-sub">Tasks spreadsheet</div></div>
        </button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="panel">
      <div class="panel-label">Import / restore</div>
      <label class="upload-label">
        <i class="ti ti-upload" style="font-size:22px;color:#888780;"></i>
        Click to upload a JSON backup
        <input type="file" accept=".json" style="display:none;" onchange="importJSON(event)" />
      </label>
      <div id="import-msg" style="font-size:13px;margin-top:10px;display:none;"></div>
    </div>
    <div class="divider"></div>
    <div class="panel">
      <div class="panel-label">Danger zone</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="export-btn" onclick="clearTasks()" style="border-color:#F09595;">
          <div style="width:34px;height:34px;border-radius:8px;background:#FCEBEB;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-trash" style="font-size:17px;color:#791F1F;"></i></div>
          <div><div class="export-btn-label" style="color:#791F1F;">Clear tasks</div><div class="export-btn-sub">Remove all tasks</div></div>
        </button>
        <button class="export-btn" onclick="clearAll()" style="border-color:#F09595;">
          <div style="width:34px;height:34px;border-radius:8px;background:#FCEBEB;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-database-off" style="font-size:17px;color:#791F1F;"></i></div>
          <div><div class="export-btn-label" style="color:#791F1F;">Clear all data</div><div class="export-btn-sub">Reset everything</div></div>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem('planner_tasks_v5') || '[]');
let creds = JSON.parse(localStorage.getItem('planner_creds_v5') || '[]');
let activeFilters = { priority: 'all', category: 'all' };
let searchQuery = '';
let expandedNotes = {};
let editingNote = null;
let calYear, calMonth, calSelected;
const now = new Date();
calYear = now.getFullYear(); calMonth = now.getMonth();
const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
calSelected = todayStr;

const months2 = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthsS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const daysW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const d2 = new Date();
document.getElementById('today-date').textContent = `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d2.getDay()]}, ${monthsS[d2.getMonth()]} ${d2.getDate()}, ${d2.getFullYear()}`;

const priOrder = { high: 0, medium: 1, low: 2 };
const catLabel = { work: 'Work', personal: 'Personal', health: 'Health', finance: 'Finance', other: 'Other' };
const priLabel = { high: 'High', medium: 'Medium', low: 'Low' };
const recurLabel = { none: '', daily: 'Daily', weekly: 'Weekly', weekdays: 'Weekdays', weekend: 'Weekends' };
const typeIcon = { Certification: 'ti-certificate', License: 'ti-license', Training: 'ti-school', Other: 'ti-file' };
const dotColor = { work: '#378ADD', personal: '#534AB7', health: '#1D9E75', finance: '#639922', other: '#888780' };

function save() { localStorage.setItem('planner_tasks_v5', JSON.stringify(tasks)); localStorage.setItem('planner_creds_v5', JSON.stringify(creds)); }

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', ['tasks','calendar','creds','export'][i] === t));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(t).classList.add('active');
  if (t === 'calendar') renderCalendar();
}

function taskOnDate(task, dateStr) {
  const taskDate = new Date(dateStr + 'T00:00:00');
  const created = new Date(task.id);
  const createdStr = `${created.getFullYear()}-${String(created.getMonth()+1).padStart(2,'0')}-${String(created.getDate()).padStart(2,'0')}`;
  if (task.recur === 'none' || !task.recur) return createdStr === dateStr;
  if (new Date(dateStr) < new Date(createdStr)) return false;
  const dow = taskDate.getDay();
  if (task.recur === 'daily') return true;
  if (task.recur === 'weekly') return dow === new Date(createdStr).getDay();
  if (task.recur === 'weekdays') return dow >= 1 && dow <= 5;
  if (task.recur === 'weekend') return dow === 0 || dow === 6;
  return false;
}

function escHtml(t) { return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function highlight(text, query) {
  if (!query) return escHtml(text);
  const esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escHtml(text).replace(new RegExp(`(${esc})`, 'gi'), '<mark>$1</mark>');
}

function addTask() {
  const text = document.getElementById('task-input').value.trim();
  const time = document.getElementById('task-time').value;
  const priority = document.getElementById('task-priority').value;
  const category = document.getElementById('task-category').value;
  const recur = document.getElementById('task-recur').value;
  const note = document.getElementById('task-note').value.trim();
  if (!text) return;
  tasks.push({ id: Date.now(), text, time, priority, category, recur, note, done: false });
  save(); renderTasks();
  document.getElementById('task-input').value = '';
  document.getElementById('task-time').value = '';
  document.getElementById('task-note').value = '';
}

function toggleTask(id) { const t = tasks.find(t => t.id === id); if (t) { t.done = !t.done; save(); renderTasks(); } }
function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); save(); renderTasks(); renderCalendar(); }
function toggleNote(id) { expandedNotes[id] = !expandedNotes[id]; renderTasks(); }
function openNoteEditor(id) { editingNote = editingNote === id ? null : id; renderTasks(); setTimeout(() => { const el = document.getElementById('note-edit-' + id); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0); }
function saveNote(id) { const el = document.getElementById('note-edit-' + id); if (!el) return; const t = tasks.find(t => t.id === id); if (t) { t.note = el.value.trim(); save(); } editingNote = null; renderTasks(); }

function onSearch() { searchQuery = document.getElementById('search-input').value; document.getElementById('clear-search').classList.toggle('show', searchQuery.length > 0); renderTasks(); }
function clearSearch() { searchQuery = ''; document.getElementById('search-input').value = ''; document.getElementById('clear-search').classList.remove('show'); renderTasks(); }
function setFilter(type, val) { activeFilters[type] = activeFilters[type] === val ? 'all' : val; renderTasks(); }

function renderFilters(count, total) {
  const pris = ['high','medium','low'], cats = ['work','personal','health','finance','other'];
  const pc = { high: '#FCEBEB', medium: '#FAEEDA', low: '#E1F5EE' }, pt = { high: '#791F1F', medium: '#633806', low: '#085041' };
  let h = '';
  pris.forEach(p => { const a = activeFilters.priority === p; h += `<button class="chip${a?' active':''}" onclick="setFilter('priority','${p}')"${a?` style="background:${pc[p]};color:${pt[p]};border-color:transparent"`:''}>${priLabel[p]}</button>`; });
  h += '<span style="width:0.5px;background:rgba(0,0,0,0.12);height:18px;margin:0 3px;display:inline-block;vertical-align:middle;"></span>';
  cats.forEach(c => { const a = activeFilters.category === c; h += `<button class="chip${a?' active':''}" onclick="setFilter('category','${c}')">${catLabel[c]}</button>`; });
  if (searchQuery || activeFilters.priority !== 'all' || activeFilters.category !== 'all') h += `<span class="search-count">${count} of ${total}</span>`;
  document.getElementById('filter-row').innerHTML = h;
}

function renderTasks() {
  let f = [...tasks];
  if (activeFilters.priority !== 'all') f = f.filter(t => t.priority === activeFilters.priority);
  if (activeFilters.category !== 'all') f = f.filter(t => t.category === activeFilters.category);
  if (searchQuery) { const q = searchQuery.toLowerCase(); f = f.filter(t => (t.text||'').toLowerCase().includes(q) || (t.note||'').toLowerCase().includes(q)); }
  renderFilters(f.length, tasks.length);
  const s = f.sort((a, b) => { if (a.done !== b.done) return a.done ? 1 : -1; if (priOrder[a.priority] !== priOrder[b.priority]) return priOrder[a.priority] - priOrder[b.priority]; return (a.time||'99:99').localeCompare(b.time||'99:99'); });
  const list = document.getElementById('task-list');
  if (!s.length) { list.innerHTML = `<div class="empty"><i class="ti ti-${searchQuery?'search-off':'clipboard-list'}"></i>${searchQuery ? `No tasks match "${escHtml(searchQuery)}"` : tasks.length ? 'No tasks match the filter.' : 'No tasks yet — add your first one above.'}</div>`; }
  else {
    list.innerHTML = s.map(t => {
      const hasNote = t.note && t.note.length > 0;
      const noteExpanded = expandedNotes[t.id];
      const isEditing = editingNote === t.id;
      const noteBlock = hasNote && noteExpanded && !isEditing ? `<div class="task-note">${highlight(t.note, searchQuery)}</div>` : '';
      const editBlock = isEditing ? `<div class="note-editor open"><textarea id="note-edit-${t.id}">${escHtml(t.note||'')}</textarea><button class="note-save-btn" onclick="saveNote(${t.id})"><i class="ti ti-check" style="font-size:12px;"></i> Save note</button></div>` : '';
      const noteToggle = hasNote && !isEditing ? `<button class="task-note-toggle" onclick="toggleNote(${t.id})"><i class="ti ti-${noteExpanded?'chevron-up':'chevron-down'}" style="font-size:11px;"></i>${noteExpanded?'Hide':'Show'} note</button>` : '';
      return `<div class="task-card${t.done?' done':''} p-${t.priority}">
        <button class="check-btn${t.done?' done':''}" onclick="toggleTask(${t.id})" title="${t.done?'Unmark':'Mark done'}">${t.done?'<i class="ti ti-check" style="font-size:11px;color:#fff;"></i>':''}</button>
        <div class="task-body">
          <div class="task-text">${highlight(t.text, searchQuery)}</div>
          <div class="task-meta">
            <span class="pill p-${t.priority}">${priLabel[t.priority]}</span>
            <span class="pill cat-${t.category}">${catLabel[t.category]}</span>
            ${t.recur&&t.recur!=='none'?`<span class="pill recur"><i class="ti ti-refresh" style="font-size:10px;vertical-align:-1px;"></i> ${recurLabel[t.recur]}</span>`:''}
            ${t.time?`<span class="pill time"><i class="ti ti-clock" style="font-size:10px;vertical-align:-1px;"></i> ${t.time}</span>`:''}
          </div>
          ${noteToggle}${noteBlock}${editBlock}
        </div>
        <div class="card-actions">
          <button class="edit-note-btn" onclick="openNoteEditor(${t.id})" title="${hasNote?'Edit note':'Add note'}"><i class="ti ti-${hasNote?'note-edit':'note'}" style="font-size:14px;"></i></button>
          <button class="del-btn" onclick="deleteTask(${t.id})" title="Delete"><i class="ti ti-x" style="font-size:13px;"></i></button>
        </div>
      </div>`;
    }).join('');
  }
  const total = tasks.length, done = tasks.filter(t => t.done).length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-left').textContent = total - done;
  document.getElementById('progress').style.width = total ? Math.round(done / total * 100) + '%' : '0%';
}

function calNav(dir) { calMonth += dir; if (calMonth > 11) { calMonth = 0; calYear++; } else if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }

function renderCalendar() {
  document.getElementById('cal-title').textContent = `${months2[calMonth]} ${calYear}`;
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  let html = '';
  daysW.forEach(d => html += `<div class="cal-dow">${d}</div>`);
  const total = Math.ceil((firstDay + daysInMonth) / 7) * 7;
  for (let i = 0; i < total; i++) {
    let dayNum, mo = calMonth, yr = calYear, other = false;
    if (i < firstDay) { dayNum = daysInPrev - (firstDay - i - 1); mo = calMonth - 1; if (mo < 0) { mo = 11; yr = calYear - 1; } other = true; }
    else if (i >= firstDay + daysInMonth) { dayNum = i - firstDay - daysInMonth + 1; mo = calMonth + 1; if (mo > 11) { mo = 0; yr = calYear + 1; } other = true; }
    else dayNum = i - firstDay + 1;
    const ds = `${yr}-${String(mo+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    const isToday = ds === todayStr, isSel = ds === calSelected;
    const dayTasks = tasks.filter(t => taskOnDate(t, ds));
    const dots = dayTasks.slice(0, 4).map(t => `<span class="cal-dot" style="background:${dotColor[t.category]||'#888'};"></span>`).join('');
    html += `<div class="cal-day${other?' other-month':''}${isToday?' today':''}${isSel?' selected':''}" onclick="selectDay('${ds}')"><div class="cal-day-num">${dayNum}</div><div>${dots}</div></div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
  renderCalTasks();
}

function selectDay(ds) { calSelected = ds; renderCalendar(); }

function renderCalTasks() {
  const d = new Date(calSelected + 'T00:00:00');
  const label = `${daysW[d.getDay()]}, ${monthsS[d.getMonth()]} ${d.getDate()}`;
  const dayTasks = tasks.filter(t => taskOnDate(t, calSelected)).sort((a, b) => priOrder[a.priority] - priOrder[b.priority]);
  let html = `<div class="cal-tasks-title">${label}</div>`;
  if (!dayTasks.length) html += `<div class="empty" style="padding:1rem;"><i class="ti ti-calendar-off" style="font-size:22px;"></i>No tasks this day.</div>`;
  else html += dayTasks.map(t => `
    <div class="task-card p-${t.priority}${t.done?' done':''}">
      <button class="check-btn${t.done?' done':''}" onclick="toggleTask(${t.id})">${t.done?'<i class="ti ti-check" style="font-size:11px;color:#fff;"></i>':''}</button>
      <div class="task-body">
        <div class="task-text">${escHtml(t.text)}</div>
        ${t.note?`<div class="task-note">${escHtml(t.note)}</div>`:''}
        <div class="task-meta">
          <span class="pill p-${t.priority}">${priLabel[t.priority]}</span>
          <span class="pill cat-${t.category}">${catLabel[t.category]}</span>
          ${t.recur&&t.recur!=='none'?`<span class="pill recur"><i class="ti ti-refresh" style="font-size:10px;vertical-align:-1px;"></i> ${recurLabel[t.recur]}</span>`:''}
          ${t.time?`<span class="pill time">${t.time}</span>`:''}
        </div>
      </div>
    </div>`).join('');
  document.getElementById('cal-tasks').innerHTML = html;
}

function addCred() {
  const name = document.getElementById('cred-name').value.trim();
  const org = document.getElementById('cred-org').value.trim();
  const expiry = document.getElementById('cred-expiry').value;
  const type = document.getElementById('cred-type').value;
  if (!name) return;
  creds.push({ id: Date.now(), name, org, expiry, type });
  save(); renderCreds();
  document.getElementById('cred-name').value = ''; document.getElementById('cred-org').value = ''; document.getElementById('cred-expiry').value = '';
}
function deleteCred(id) { creds = creds.filter(c => c.id !== id); save(); renderCreds(); }
function expiryStatus(exp) {
  if (!exp) return { cls: 'ok', label: 'No expiry' };
  const d = Math.ceil((new Date(exp) - new Date()) / 86400000);
  if (d < 0) return { cls: 'exp', label: 'Expired' };
  if (d <= 30) return { cls: 'warn', label: `${d}d left` };
  return { cls: 'ok', label: `${d}d left` };
}
function renderCreds() {
  const list = document.getElementById('cred-list');
  if (!creds.length) { list.innerHTML = '<div class="empty"><i class="ti ti-id-badge"></i>No credentials yet.</div>'; return; }
  list.innerHTML = creds.map(c => {
    const s = expiryStatus(c.expiry);
    const ic = typeIcon[c.type] || 'ti-file';
    return `<div class="cred-card">
      <div class="cred-icon"><i class="ti ${ic}" style="font-size:17px;color:#534AB7;"></i></div>
      <div style="flex:1;min-width:0;"><div class="cred-name">${escHtml(c.name)}</div><div class="cred-meta">${escHtml(c.type)}${c.org?' · '+escHtml(c.org):''}${c.expiry?' · Expires '+c.expiry:''}</div></div>
      <span class="badge ${s.cls}">${s.label}</span>
      <button class="del-btn" onclick="deleteCred(${c.id})"><i class="ti ti-x" style="font-size:13px;"></i></button>
    </div>`;
  }).join('');
}

function exportJSON() {
  const blob = new Blob([JSON.stringify({ tasks, creds, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'planner-backup.json'; a.click();
}
function exportCSV() {
  const header = 'Text,Note,Priority,Category,Time,Recurring,Done';
  const rows = tasks.map(t => [`"${(t.text||'').replace(/"/g,'""')}"`, `"${(t.note||'').replace(/"/g,'""')}"`, t.priority, t.category, t.time||'', recurLabel[t.recur]||'', t.done?'Yes':'No'].join(','));
  const blob = new Blob([[header, ...rows].join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'planner-tasks.csv'; a.click();
}
function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.tasks) tasks = data.tasks;
      if (data.creds) creds = data.creds;
      save(); renderTasks(); renderCreds();
      const msg = document.getElementById('import-msg');
      msg.textContent = `Restored ${tasks.length} tasks and ${creds.length} credentials.`;
      msg.style.display = 'block'; msg.style.color = '#085041';
      setTimeout(() => msg.style.display = 'none', 4000);
    } catch {
      const msg = document.getElementById('import-msg');
      msg.textContent = 'Invalid file. Please use a JSON backup from this app.';
      msg.style.display = 'block'; msg.style.color = '#791F1F';
    }
  };
  reader.readAsText(file);
}
function clearTasks() { if (confirm('Remove all tasks? This cannot be undone.')) { tasks = []; save(); renderTasks(); renderCalendar(); } }
function clearAll() { if (confirm('Clear ALL data? This cannot be undone.')) { tasks = []; creds = []; save(); renderTasks(); renderCreds(); renderCalendar(); } }

function checkReminders() {
  const n = new Date();
  const hhmm = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  const due = tasks.filter(t => !t.done && t.time === hhmm && taskOnDate(t, todayStr));
  const expiring = creds.filter(c => { if (!c.expiry) return false; const d = Math.ceil((new Date(c.expiry) - n) / 86400000); return d >= 0 && d <= 7; });
  let msg = '';
  if (due.length) msg = `Reminder: ${due.map(t => t.text).join(', ')}`;
  else if (expiring.length) msg = `Expiring soon: ${expiring.map(c => c.name).join(', ')}`;
  if (msg) {
    const bar = document.getElementById('notif');
    document.getElementById('notif-text').textContent = msg;
    bar.classList.add('show');
    if (Notification.permission === 'granted') due.forEach(t => new Notification('Task reminder', { body: t.text }));
    else if (Notification.permission !== 'denied') Notification.requestPermission();
    setTimeout(() => bar.classList.remove('show'), 9000);
  }
}

renderTasks(); renderCreds(); renderCalendar();
setInterval(checkReminders, 30000); checkReminders();
document.getElementById('task-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) addTask(); });
document.getElementById('cred-name').addEventListener('keydown', e => { if (e.key === 'Enter') addCred(); });
</script>
