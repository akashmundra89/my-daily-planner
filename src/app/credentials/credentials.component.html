<!-- Add credential form -->
<div class="panel">
  <div class="panel-label">Add credential</div>
  <div class="row">
    <input [(ngModel)]="name"   placeholder="Certification or license name..." />
    <input [(ngModel)]="org"    placeholder="Issuing org" style="width:130px;flex:0 0 130px" />
  </div>
  <div class="row">
    <input type="date" [(ngModel)]="expiry" />
    <select [(ngModel)]="type">
      <option>Certification</option>
      <option>License</option>
      <option>Training</option>
      <option>Other</option>
    </select>
    <button class="add-btn" (click)="add()">+ Add</button>
  </div>
</div>

<!-- Empty state -->
<div *ngIf="planner.credentials.length === 0" class="empty">
  No credentials yet — add one above.
</div>

<!-- Credential cards -->
<div *ngFor="let c of planner.credentials" class="cred-card">
  <div class="cred-icon">{{ c.type === 'Certification' ? '🏅' : c.type === 'License' ? '📋' : c.type === 'Training' ? '🎓' : '📄' }}</div>
  <div class="cred-info">
    <div class="cred-name">{{ c.name }}</div>
    <div class="cred-meta">
      {{ c.type }}<span *ngIf="c.org"> · {{ c.org }}</span><span *ngIf="c.expiry"> · Expires {{ c.expiry }}</span>
    </div>
  </div>
  <span class="badge" [ngClass]="planner.expiryStatus(c.expiry).cls">
    {{ planner.expiryStatus(c.expiry).label }}
  </span>
  <button class="del-btn" (click)="planner.deleteCredential(c.id)">✕</button>
</div>
